name: e2e
# Browser e2e + screens/axe. Manual only (Nov 4, 2026): too slow/costly for every PR on hosted minutes.
# Run by hand: gh workflow run e2e --ref <branch>
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camp_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/camp_e2e
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/camp_e2e
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      EMAIL_ADAPTER: console
      SKIP_EXTERNAL_SERVICES: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: |
          pnpm exec playwright install chromium
          # System libs: retry apt (mirror hiccups), then prove the browser actually launches.
          for i in 1 2 3; do pnpm exec playwright install-deps chromium && break; sleep 20; done || true
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"
      - name: Migrate + seed (fake demo accounts)
        run: pnpm seed
      - run: pnpm build
      - name: Playwright e2e, all specs (login, permissions, obligations)
        run: pnpm test:e2e
      - name: Demo seed (fake personas and module data)
        env:
          DEMO_MODE: "true"
        run: pnpm seed:demo
      - name: Screens + accessibility (role picker, every module home, 390/1280, day/night, axe)
        env:
          DEMO_MODE: "true"
        run: pnpm exec playwright test e2e/screens.spec.ts --output test-results/screens
      - name: Upload Playwright report and traces
        if: always()
        continue-on-error: true # a full artifact store must not fail the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .outbox/server.log
          retention-days: 14
