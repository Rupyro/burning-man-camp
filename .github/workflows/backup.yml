name: backup
# Nightly backup of the production database (Nov 19, 2026; approved by Ruchir, t16u).
# pg_dump in the official postgres:18 image (matches Neon's server), encrypted with a passphrase,
# kept as a workflow artifact for 7 days. Public-repo Actions minutes are free.
# Needs two repo secrets: BACKUP_DATABASE_URL (the unpooled Neon URL) and BACKUP_PASSPHRASE.
# Without them the job skips. The passphrase's copy lives in Vercel (production env), so a
# restore never depends on GitHub alone. Restore steps: docs/runbook.md.
on:
  schedule:
    - cron: "17 10 * * *" # 10:17 UTC = 2:17 AM Pacific (3:17 AM in summer)
  workflow_dispatch: {}
concurrency:
  group: backup
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backup:
    name: pg_dump to an encrypted artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SECRETS: ${{ secrets.BACKUP_DATABASE_URL != '' && secrets.BACKUP_PASSPHRASE != '' }}
    steps:
      - name: Skip without secrets
        if: env.HAS_SECRETS != 'true'
        run: echo "BACKUP_DATABASE_URL or BACKUP_PASSPHRASE isn't set, so there's nothing to back up."
      - name: Dump and encrypt
        if: env.HAS_SECRETS == 'true'
        env:
          PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p out
          stamp="$(date -u +%Y-%m-%dT%H%MZ)"
          docker run --rm -e PGURL postgres:18 \
            sh -c 'pg_dump --no-owner --no-privileges --format=custom "$PGURL"' > out/db.dump
          test -s out/db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 -o "out/db-${stamp}.dump.gpg" out/db.dump \
            3<<<"$PASSPHRASE"
          rm out/db.dump
          ls -l out
      - name: Keep for 7 days
        if: env.HAS_SECRETS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-backup
          path: out/*.gpg
          retention-days: 7
          if-no-files-found: error
