name: ci
on:
  pull_request: {}
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: check
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway values; no real secrets are needed before deploys exist.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/camp_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/camp_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/camp_test
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_ADAPTER: console
      SKIP_EXTERNAL_SERVICES: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome + ESLint boundaries)
        run: pnpm lint
      - name: Module rules
        run: pnpm check:modules
      - run: pnpm typecheck
      - name: Unit + DB tests with coverage thresholds (vitest.config.ts)
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        continue-on-error: true # a full artifact store must not fail the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - name: Drizzle check (base + each module)
        run: pnpm db:check
      - name: Migrate + seed smoke (twice, must be idempotent)
        run: pnpm seed && pnpm seed
      - run: pnpm build
