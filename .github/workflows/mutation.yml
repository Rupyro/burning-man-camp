name: mutation
# Stryker mutation testing on the security core (stryker.config.mjs). Too slow for every PR, so
# it runs on demand only. The HTML report is uploaded as an artifact; the run fails when
# the score drops below `thresholds.break`.
on:
  workflow_dispatch: {} # manual only (Nov 4, 2026); hosted minutes are limited
  # Not on pull_request: ~40-70 min would use most of the free hosted minutes.
  # After changing the mutation setup, run it by hand: gh workflow run mutation --ref <branch>.
concurrency:
  group: mutation
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stryker:
    name: stryker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 120
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/camp_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/camp_test
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      SKIP_EXTERNAL_SERVICES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore incremental results (only changed code is re-mutated)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-main-
      - name: Stryker
        run: pnpm mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
