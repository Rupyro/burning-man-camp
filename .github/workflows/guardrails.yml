name: guardrails
# Checks on the PR diff that stop an agent from quietly weakening the gates.
# Labels (added by Ruchir only) turn specific failures into warnings; see CONTRIBUTING.md.
# Uses pull_request (never pull_request_target): no secrets, read-only token.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  guardrail:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check: [protected-paths, test-integrity, hygiene, pr-size, new-dependencies]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The checker runs from the BASE commit so a PR can't edit the rules it is judged by.
      - name: Use the base branch's guardrail script
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:scripts/ci/guardrails.ts" 2>/dev/null; then
            git checkout "$BASE_SHA" -- scripts/ci/guardrails.ts scripts/ci/guardrails-lib.ts
          else
            echo "::notice::Base has no guardrails yet (this PR introduces them); using the PR's copy."
          fi
      - run: pnpm guardrails ${{ matrix.check }}
